# Publishes via npm Trusted Publishing (OIDC) — no token secret required.
# The trusted publisher must be configured on npmjs.com for this package:
# GitHub Actions / KAE-Labs / bi-agent-kit / publish.yml
name: Publish

on:
  release:
    types: [published]

jobs:
  # Tests run in a job with no id-token permission, so dependency install
  # and the test suite never execute within OIDC-credential reach.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
      # OIDC trusted publishing requires npm 11.5.1+; Node 22 bundles npm 10.x.
      # Pinned exactly — the tool that holds publish rights must not float.
      - run: npm install -g npm@12.0.1
      # --ignore-scripts: no dependency lifecycle script runs inside the
      # OIDC-scoped job (deps are exercised in the test job above instead).
      - run: npm ci --ignore-scripts
      - run: npm publish

  # Mirror to GitHub Packages (requires an owner-scoped name). The npm
  # registry remains canonical; this copy gives repo-sidebar visibility.
  publish-github:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://npm.pkg.github.com
      - run: npm ci --ignore-scripts
      - name: Scope package name for GitHub Packages
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.name='@kae-labs/bi-agent-kit';fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
      # --no-provenance: provenance attestation lives on the canonical npm
      # publish (which has id-token: write); this mirror job only holds
      # packages: write, so npm's provenance generation would EUSAGE here.
      - run: npm publish --provenance=false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
