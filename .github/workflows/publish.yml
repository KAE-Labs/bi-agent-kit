# Publishes via npm Trusted Publishing (OIDC) — no token secret required.
# The trusted publisher must be configured on npmjs.com for this package:
# GitHub Actions / KAE-Labs / bi-agent-kit / publish.yml
name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
      # OIDC trusted publishing requires npm 11.5.1+; Node 22 bundles npm 10.x
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish
