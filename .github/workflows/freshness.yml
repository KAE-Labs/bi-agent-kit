# Weekly upstream checks:
#  - template freshness: every registry-backed template package still exists
#  - upstream drift: new Microsoft MCP catalog servers (template candidates)
#    and major-version jumps in template packages (re-verify args)
# Drift findings open a GitHub issue and update the committed state file.
name: Freshness

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

jobs:
  freshness:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Check template packages still exist
        run: node scripts/check-template-freshness.mjs
      - name: Check upstream drift
        id: drift
        run: |
          set +e
          node scripts/check-upstream-drift.mjs > drift-report.txt 2>&1
          code=$?
          set -e
          cat drift-report.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != "0" ] && [ "$code" != "2" ]; then exit "$code"; fi
      - name: Open issue and commit state on drift
        if: steps.drift.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Upstream drift detected: $(date -u +%Y-%m-%d)" \
            --body-file drift-report.txt \
            --label upstream-drift || \
          gh issue create \
            --title "Upstream drift detected: $(date -u +%Y-%m-%d)" \
            --body-file drift-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/upstream-state.json
          git commit -m "Update upstream state after drift detection"
          git push
